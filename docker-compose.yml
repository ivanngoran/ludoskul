services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ludoskul
      POSTGRES_PASSWORD: ludoskul
      POSTGRES_DB: ludoskul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://ludoskul:ludoskul@postgres:5432/ludoskul
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
